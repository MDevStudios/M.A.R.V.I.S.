<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>M.A.R.V.I.S. | Local-First AI Desktop Assistant</title>
  <style>
    :root {
      --bg-color: #050505;
      --card-bg: #0d0f12;
      --accent-color: #00E5FF;
      --text-color: #e0e0e0;
      --text-dim: #a0a0a0;
      --border-color: #1a1d24;
    }
    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    header {
      width: 100%;
      max-width: 1000px;
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-sizing: border-box;
    }
    .logo {
      font-weight: bold;
      letter-spacing: 2px;
      color: var(--accent-color);
      font-size: 1.2rem;
    }
    .hero {
      text-align: center;
      max-width: 900px;
      margin: 60px 20px 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .hud-tag {
      font-family: 'Courier New', Courier, monospace;
      color: var(--accent-color);
      font-size: 0.85rem;
      letter-spacing: 3px;
      margin-bottom: 15px;
      opacity: 0.8;
      text-transform: uppercase;
    }
    .main-title {
      font-size: 4.5rem;
      font-weight: 900;
      letter-spacing: 6px;
      color: #ffffff;
      margin: 0;
      text-shadow: 0 0 20px rgba(0, 229, 255, 0.3);
    }
    .sub-slogan {
      font-size: 1.4rem;
      font-weight: 400;
      color: var(--text-color);
      margin: 25px 0 15px 0;
      line-height: 1.5;
    }
    .sub-slogan .highlight {
      color: var(--accent-color);
      font-weight: 700;
      text-shadow: 0 0 10px rgba(0, 229, 255, 0.2);
    }
    .hero-description {
      font-size: 1.05rem;
      color: var(--text-dim);
      max-width: 650px;
      margin-bottom: 35px;
      line-height: 1.6;
    }
    .cta-group {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .cta-btn.primary {
      background: var(--accent-color);
      color: #000000;
      font-weight: bold;
      border: 1px solid var(--accent-color);
      padding: 14px 32px;
      font-size: 0.95rem;
      border-radius: 4px;
      text-decoration: none;
      letter-spacing: 1px;
      transition: all 0.3s ease;
    }
    .cta-btn.primary:hover {
      box-shadow: 0 0 20px rgba(0, 229, 255, 0.6);
      transform: translateY(-2px);
    }
    .cta-btn.secondary {
      background: transparent;
      color: #ffffff;
      border: 1px solid #333333;
      padding: 14px 32px;
      font-size: 0.95rem;
      border-radius: 4px;
      text-decoration: none;
      letter-spacing: 1px;
      transition: all 0.3s ease;
    }
    .cta-btn.secondary:hover {
      border-color: var(--accent-color);
      color: var(--accent-color);
      transform: translateY(-2px);
    }

    /* SECCIÓN ¿QUÉ ES MARVIS? */
    .about-section {
      max-width: 1000px;
      width: 90%;
      margin: 40px 0;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 40px;
      box-sizing: border-box;
    }
    .about-header {
      text-align: center;
      margin-bottom: 40px;
    }
    .about-header h2 {
      font-size: 2.2rem;
      color: #ffffff;
      margin-bottom: 15px;
      letter-spacing: 1px;
    }
    .about-header p {
      color: var(--text-dim);
      font-size: 1.1rem;
      max-width: 750px;
      margin: 0 auto;
      line-height: 1.7;
    }
    .pillars-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 25px;
      margin-top: 30px;
    }
    .pillar-card {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 25px;
      transition: all 0.3s ease;
    }
    .pillar-card:hover {
      border-color: var(--accent-color);
      transform: translateY(-3px);
    }
    .pillar-card .icon {
      font-size: 1.8rem;
      color: var(--accent-color);
      margin-bottom: 15px;
      font-family: 'Courier New', Courier, monospace;
    }
    .pillar-card h3 {
      font-size: 1.25rem;
      color: #ffffff;
      margin-top: 0;
      margin-bottom: 10px;
    }
    .pillar-card p {
      color: var(--text-dim);
      font-size: 0.95rem;
      line-height: 1.6;
      margin: 0;
    }

    /* SECCIÓN FUNCIONALIDADES & CUSTOMIZATION */
    .features-section {
      max-width: 1000px;
      width: 90%;
      margin: 40px 0;
    }
    .section-title {
      text-align: center;
      margin-bottom: 40px;
    }
    .section-title h2 {
      font-size: 2.2rem;
      color: #ffffff;
      margin-bottom: 10px;
    }
    .features-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }
    .feature-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 25px;
      transition: all 0.3s ease;
    }
    .feature-card:hover {
      border-color: var(--accent-color);
    }
    .feature-card h3 {
      color: var(--accent-color);
      font-size: 1.1rem;
      margin-top: 0;
      margin-bottom: 12px;
    }
    .feature-card p {
      color: var(--text-dim);
      font-size: 0.9rem;
      line-height: 1.6;
      margin: 0;
    }

    /* BLOQUE PERSONALIZACIÓN Y MODULARIDAD */
    .customization-box {
      margin-top: 40px;
      background: linear-gradient(180deg, rgba(13, 15, 18, 1) 0%, rgba(5, 5, 5, 1) 100%);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 40px;
      box-sizing: border-box;
    }
    .customization-box h3 {
      font-size: 1.8rem;
      color: #ffffff;
      margin-top: 0;
      margin-bottom: 15px;
    }
    .custom-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 25px;
      margin-top: 25px;
    }
    .custom-item h4 {
      color: var(--accent-color);
      font-size: 1.1rem;
      margin-bottom: 8px;
    }
    .custom-item p {
      color: var(--text-dim);
      font-size: 0.95rem;
      line-height: 1.6;
      margin: 0;
    }
    .version-note {
      margin-top: 30px;
      padding: 15px;
      background: rgba(0, 229, 255, 0.05);
      border-left: 3px solid var(--accent-color);
      border-radius: 4px;
      font-size: 0.88rem;
      color: var(--text-dim);
    }
    .version-note strong {
      color: var(--accent-color);
    }

    footer {
      margin-top: auto;
      padding: 30px;
      color: var(--text-dim);
      font-size: 0.9rem;
      text-align: center;
    }
    footer a {
      color: var(--text-dim);
      margin: 0 10px;
      text-decoration: none;
    }
    footer a:hover {
      color: var(--accent-color);
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">M.A.R.V.I.S.</div>
  </header>

  <!-- HERO SECTION -->
  <main class="hero">
    <div class="hud-tag">// SYSTEM
